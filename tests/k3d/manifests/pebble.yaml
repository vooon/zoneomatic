# Pebble: Let's Encrypt's ACME test server. It validates dns-01 against the
# CoreDNS serving zoneomatic's zone file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: zoneomatic-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pebble
  template:
    metadata:
      labels:
        app: pebble
    spec:
      containers:
        - name: pebble
          image: ghcr.io/letsencrypt/pebble:2.10.1
          args: ["-config", "test/config/pebble-config.json", "-dnsserver", "10.43.53.53:53"]
          env:
            - { name: PEBBLE_VA_NOSLEEP, value: "1" }
            - { name: PEBBLE_WFE_NONCEREJECT, value: "0" }
            - { name: PEBBLE_AUTHZREUSE, value: "0" }
---
apiVersion: v1
kind: Service
metadata:
  name: pebble
  namespace: zoneomatic-e2e
spec:
  selector:
    app: pebble
  ports:
    - { name: acme, port: 14000, targetPort: 14000 }
