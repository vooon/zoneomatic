name: cert-manager k3d Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: k3d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  K3D_VERSION: v5.8.3

jobs:
  k3d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install k3d
        run: |
          curl -fsSL -o /usr/local/bin/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          chmod +x /usr/local/bin/k3d
          k3d version

      - name: Run cert-manager rfc2136 test
        run: go test -tags=k3d -v -timeout=15m -count=1 ./tests/k3d/...
